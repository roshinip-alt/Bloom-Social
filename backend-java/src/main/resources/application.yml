spring:
  application:
    name: bloom-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bloom}
    username: ${POSTGRES_USER:bloom}
    password: ${POSTGRES_PASSWORD:bloom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Shared SQL lives in /database so Docker, tests and local runs use one source of truth.
    locations: ${FLYWAY_LOCATIONS:filesystem:../database/migrations,filesystem:../database/seeds}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs
  paths-to-match: /api/v1/**

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"

bloom:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  workspace:
    seed-demo-on-empty: ${BLOOM_SEED_DEMO:true}
    demo-reset-enabled: ${BLOOM_DEMO_RESET_ENABLED:true}
  integration:
    base-url: ${INTEGRATION_SERVICE_URL:http://localhost:8090}
    internal-token: ${INTERNAL_API_TOKEN:}
    connect-timeout: 3s
    read-timeout: 60s
  crypto:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    key-version: ${TOKEN_ENCRYPTION_KEY_VERSION:1}
  oauth:
    session-ttl: 10m
  sync:
    async: true
    scheduled-enabled: ${BLOOM_SCHEDULED_SYNC:true}
    interval: 6h
    retry-poll: 1m
    max-attempts: 5
    base-backoff: 30s
    max-backoff: 30m
