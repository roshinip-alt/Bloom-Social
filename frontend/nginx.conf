server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/   { proxy_pass http://backend:8080; proxy_set_header X-Forwarded-Proto $scheme; }
  location /oauth/ { proxy_pass http://integration:8090; }
  location /webhooks/ { proxy_pass http://integration:8090; }
  location /internal/ { return 404; }  # service-to-service only
  location / { try_files $uri /index.html; }
}
